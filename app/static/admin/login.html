<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLMun Admin — Login</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body {
    background: linear-gradient(135deg, #0d3b2e, #1a5f45);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", sans-serif;
  }
  .login-card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 14px;
    padding: 40px 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .login-card h1 {
    font-size: 24px;
    color: #0d3b2e;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .login-card p.sub {
    color: #6b7d75;
    font-size: 14px;
    margin-bottom: 28px;
  }
  .brand-badge {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a5f45, #0d3b2e);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 18px;
  }
  .form-control {
    height: 48px;
    border-radius: 8px;
    border: 1.5px solid #d7e2dc;
    background: #f4f9f6;
    font-size: 15px;
  }
  .form-control:focus {
    border-color: #1a5f45;
    box-shadow: 0 0 0 3px rgba(26, 95, 69, 0.15);
    background: #fff;
  }
  .btn-login {
    height: 48px;
    border-radius: 8px;
    background: linear-gradient(160deg, #1a5f45, #0d3b2e);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    border: none;
    width: 100%;
    transition: 0.2s;
  }
  .btn-login:hover { filter: brightness(1.1); color: #fff; }
  .btn-login:disabled { opacity: 0.6; }
  .alert-box {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 16px;
    display: none;
    background: #fdecea;
    color: #b3261e;
    border: 1px solid #f5c6c2;
  }
  .alert-box.show { display: block; }
  .back-link {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
  }
  .back-link a { color: #1a5f45; text-decoration: none; font-weight: 600; }
  .back-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-badge">PLMun</div>
  <h1>Admin Portal</h1>
  <p class="sub">Sign in to manage the chatbot knowledge base.</p>

  <div id="errorBox" class="alert-box"></div>

  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" class="form-control" id="email" placeholder="admin@plmun.edu.ph" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" class="form-control" id="password" placeholder="Enter password" required>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">
      <i class="fa-solid fa-sign-in-alt mr-2"></i>Sign In
    </button>
  </form>

  <div class="back-link">
    <a href="/">← Back to student site</a>
  </div>
</div>

<script>
const API = "";

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const errorBox = document.getElementById("errorBox");

  errorBox.classList.remove("show");
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Signing in...';

  try {
    const res = await fetch(API + "/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      }),
    });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.detail || "Login failed.");
    }

    localStorage.setItem("plmun_admin_token", data.access_token);
    localStorage.setItem("plmun_admin_name", data.full_name || "");
    localStorage.setItem("plmun_admin_role", data.role || "");
    window.location.href = "/admin/dashboard";
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add("show");
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-sign-in-alt mr-2"></i>Sign In';
  }
});
</script>
</body>
</html>
