<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLMun Admin — Knowledge Base</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button" aria-label="Toggle sidebar" title="Toggle sidebar">
          <i class="fas fa-bars" aria-hidden="true"></i>
        </a>
      </li>
    </ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item dropdown">
        <a class="nav-link" data-toggle="dropdown" href="#">
          <i class="far fa-user"></i>
          <span id="adminName" class="ml-1">Admin</span>
        </a>
        <div class="dropdown-menu dropdown-menu-right">
          <a href="#" class="dropdown-item" id="logoutBtn">
            <i class="fas fa-sign-out-alt mr-2"></i>Logout
          </a>
        </div>
      </li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="/admin/dashboard" class="brand-link">
      <span class="brand-text font-weight-bold ml-2">PLMun Admin</span>
    </a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="info">
          <a href="#" class="d-block" id="sidebarName">Admin</a>
        </div>
      </div>
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item">
            <a href="/admin/dashboard" class="nav-link">
              <i class="nav-icon fas fa-tachometer-alt"></i>
              <p>Dashboard</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/admin/kb" class="nav-link active">
              <i class="nav-icon fas fa-database"></i>
              <p>Knowledge Base</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/admin/logs" class="nav-link">
              <i class="nav-icon fas fa-comments"></i>
              <p>Conversation Logs</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/" class="nav-link">
              <i class="nav-icon fas fa-arrow-left"></i>
              <p>Back to Student Site</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6"><h1 class="m-0">Knowledge Base</h1></div>
          <div class="col-sm-6 text-right">
            <button class="btn btn-success" id="newEntryBtn">
              <i class="fas fa-plus mr-1"></i>New Entry
            </button>
          </div>
        </div>
      </div>
    </div>

    <section class="content">
      <div class="container-fluid">
        <div class="card">
          <div class="card-body p-0">
            <table class="table table-striped table-hover">
              <thead>
                <tr>
                  <th style="width:60px">ID</th>
                  <th style="width:140px">Category</th>
                  <th>Question</th>
                  <th style="width:120px">Updated</th>
                  <th style="width:130px">Actions</th>
                </tr>
              </thead>
              <tbody id="kbTable">
                <tr><td colspan="5" class="text-center text-muted p-4">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer class="main-footer">
    <strong>PLMun Chatbot Admin</strong> — Capstone Project 2026
  </footer>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Edit KB Entry</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label for="editCategory">Category</label>
          <select class="form-control" id="editCategory" aria-label="Category">
            <option value="enrollment">Enrollment</option>
            <option value="documents">Documents</option>
            <option value="scholarship">Scholarship</option>
            <option value="graduation">Graduation</option>
            <option value="schedule">Schedule</option>
            <option value="policy">Policy</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editQuestion">Question</label>
          <input type="text" class="form-control" id="editQuestion" aria-label="Question">
        </div>
        <div class="form-group">
          <label for="editAnswerEn">Answer (English)</label>
          <textarea class="form-control" id="editAnswerEn" rows="4" aria-label="Answer in English"></textarea>
        </div>
        <div class="form-group">
          <label for="editAnswerFil">Answer (Filipino)</label>
          <textarea class="form-control" id="editAnswerFil" rows="4" aria-label="Answer in Filipino"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="saveEntryBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
<script src="/admin/admin-shell.js"></script>
<script>
(async function () {
  await initAdminShell();
  await loadKB();

  document.getElementById("newEntryBtn").addEventListener("click", () => openEditor(null));
  document.getElementById("saveEntryBtn").addEventListener("click", saveEntry);
})();

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadKB() {
  const res = await adminFetch("/api/admin/kb");
  if (!res) return;
  const entries = await res.json();
  const tbody = document.getElementById("kbTable");

  if (!entries.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted p-4">No entries yet. Click "New Entry" to create one.</td></tr>';
    return;
  }

  tbody.innerHTML = entries.map(e => `
    <tr>
      <td>${e.id}</td>
      <td><span class="badge badge-info">${e.category}</span></td>
      <td>${escapeHtml(e.question)}</td>
      <td><small>${e.last_updated_at ? e.last_updated_at.slice(0,10) : '-'}</small></td>
      <td>
        <button class="btn btn-sm btn-warning edit-btn" data-id="${e.id}"><i class="fas fa-edit"></i></button>
        <button class="btn btn-sm btn-danger delete-btn" data-id="${e.id}"><i class="fas fa-trash"></i></button>
      </td>
    </tr>
  `).join("");

  document.querySelectorAll(".edit-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = parseInt(btn.dataset.id);
      const entry = entries.find(e => e.id === id);
      if (entry) openEditor(entry);
    });
  });

  document.querySelectorAll(".delete-btn").forEach(btn => {
    btn.addEventListener("click", () => deleteEntry(parseInt(btn.dataset.id)));
  });
}

function openEditor(entry) {
  document.getElementById("modalTitle").textContent = entry ? "Edit KB Entry" : "New KB Entry";
  document.getElementById("editId").value = entry ? entry.id : "";
  document.getElementById("editCategory").value = entry ? entry.category : "enrollment";
  document.getElementById("editQuestion").value = entry ? entry.question : "";
  document.getElementById("editAnswerEn").value = entry ? entry.answer_en : "";
  document.getElementById("editAnswerFil").value = entry ? entry.answer_fil : "";
  $("#editModal").modal("show");
}

async function saveEntry() {
  const id = document.getElementById("editId").value;
  const payload = {
    category: document.getElementById("editCategory").value,
    question: document.getElementById("editQuestion").value.trim(),
    answer_en: document.getElementById("editAnswerEn").value.trim(),
    answer_fil: document.getElementById("editAnswerFil").value.trim(),
  };

  if (!payload.question || !payload.answer_en || !payload.answer_fil) {
    alert("All fields are required.");
    return;
  }

  const path = id ? `/api/admin/kb/${id}` : "/api/admin/kb";
  const method = id ? "PUT" : "POST";

  const res = await adminFetch(path, { method, body: JSON.stringify(payload) });
  if (!res || !res.ok) {
    alert("Save failed.");
    return;
  }

  $("#editModal").modal("hide");
  await loadKB();
}

async function deleteEntry(id) {
  if (!confirm("Delete this KB entry? This cannot be undone.")) return;
  const res = await adminFetch(`/api/admin/kb/${id}`, { method: "DELETE" });
  if (!res || !res.ok) {
    alert("Delete failed.");
    return;
  }
  await loadKB();
}
</script>
</body>
</html>
