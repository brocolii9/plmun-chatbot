<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLMun Admin — Conversation Logs</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button" aria-label="Toggle sidebar" title="Toggle sidebar">
          <i class="fas fa-bars" aria-hidden="true"></i>
        </a>
      </li>
    </ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item dropdown">
        <a class="nav-link" data-toggle="dropdown" href="#">
          <i class="far fa-user"></i>
          <span id="adminName" class="ml-1">Admin</span>
        </a>
        <div class="dropdown-menu dropdown-menu-right">
          <a href="#" class="dropdown-item" id="logoutBtn">
            <i class="fas fa-sign-out-alt mr-2"></i>Logout
          </a>
        </div>
      </li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="/admin/dashboard" class="brand-link">
      <span class="brand-text font-weight-bold ml-2">PLMun Admin</span>
    </a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="info">
          <a href="#" class="d-block" id="sidebarName">Admin</a>
        </div>
      </div>
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item">
            <a href="/admin/dashboard" class="nav-link">
              <i class="nav-icon fas fa-tachometer-alt"></i>
              <p>Dashboard</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/admin/kb" class="nav-link">
              <i class="nav-icon fas fa-database"></i>
              <p>Knowledge Base</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/admin/logs" class="nav-link active">
              <i class="nav-icon fas fa-comments"></i>
              <p>Conversation Logs</p>
            </a>
          </li>
          <li class="nav-item">
            <a href="/" class="nav-link">
              <i class="nav-icon fas fa-arrow-left"></i>
              <p>Back to Student Site</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6"><h1 class="m-0">Conversation Logs</h1></div>
          <div class="col-sm-6 text-right"><small class="text-muted" id="totalLabel">—</small></div>
        </div>
      </div>
    </div>

    <section class="content">
      <div class="container-fluid">
        <div class="card">
          <div class="card-body p-0">
            <table class="table table-sm table-striped">
              <thead>
                <tr>
                  <th style="width:60px">ID</th>
                  <th style="width:90px">Sender</th>
                  <th style="width:190px">Intent</th>
                  <th style="width:100px">Confidence</th>
                  <th>Message</th>
                  <th style="width:160px">Timestamp</th>
                </tr>
              </thead>
              <tbody id="logsTable">
                <tr><td colspan="6" class="text-center text-muted p-4">Loading…</td></tr>
              </tbody>
            </table>
          </div>
          <div class="card-footer clearfix">
            <button class="btn btn-sm btn-secondary float-left" id="prevBtn" disabled>← Prev</button>
            <span class="float-left ml-3 mt-1" id="pageInfo">Page 1</span>
            <button class="btn btn-sm btn-secondary float-right" id="nextBtn">Next →</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <footer class="main-footer">
    <strong>PLMun Chatbot Admin</strong> — Capstone Project 2026
  </footer>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
<script src="/admin/admin-shell.js"></script>
<script>
const PAGE_SIZE = 50;
let offset = 0;

(async function () {
  await initAdminShell();
  await loadLogs();

  document.getElementById("prevBtn").addEventListener("click", () => {
    offset = Math.max(0, offset - PAGE_SIZE);
    loadLogs();
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    offset += PAGE_SIZE;
    loadLogs();
  });
})();

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadLogs() {
  const res = await adminFetch(`/api/admin/logs?limit=${PAGE_SIZE}&offset=${offset}`);
  if (!res) return;
  const data = await res.json();

  document.getElementById("totalLabel").textContent = `Total messages: ${data.total}`;
  document.getElementById("pageInfo").textContent =
    `Page ${Math.floor(offset / PAGE_SIZE) + 1} of ${Math.max(1, Math.ceil(data.total / PAGE_SIZE))}`;
  document.getElementById("prevBtn").disabled = offset === 0;
  document.getElementById("nextBtn").disabled = offset + PAGE_SIZE >= data.total;

  const tbody = document.getElementById("logsTable");
  if (!data.messages.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted p-4">No messages yet.</td></tr>';
    return;
  }

  tbody.innerHTML = data.messages.map(m => `
    <tr>
      <td>${m.id}</td>
      <td><span class="badge badge-${m.sender === 'student' ? 'primary' : 'success'}">${m.sender}</span></td>
      <td><code>${m.intent_matched || '—'}</code></td>
      <td>${m.confidence_score !== null ? (m.confidence_score * 100).toFixed(1) + '%' : '—'}</td>
      <td>${escapeHtml(m.text)}</td>
      <td><small>${m.timestamp.replace('T', ' ').slice(0, 19)}</small></td>
    </tr>
  `).join("");
}
</script>
</body>
</html>
