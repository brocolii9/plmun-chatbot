<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLMun Chatbot</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d3b2e">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0d3b2e, #1a5f45);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
  }
  .splash {
    text-align: center;
    padding: 40px;
  }
  .logo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: white;
    color: #0d3b2e;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 22px;
    margin-bottom: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 28px;
    margin-bottom: 8px;
    font-weight: 700;
  }
  p {
    font-size: 14px;
    opacity: 0.75;
    margin-bottom: 30px;
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div class="splash">
  <div class="logo">PLMun</div>
  <h1>PLMun Chatbot</h1>
  <p>Registrar &amp; Academic Help</p>
  <div class="spinner"></div>
</div>

<script>
  // Redirect to correct page after short delay (for splash visibility)
  (function () {
    const hasToken = !!localStorage.getItem("plmun_token");

    // Show splash for 800ms then redirect
    setTimeout(() => {
      if (hasToken) {
        window.location.replace("/main_page.html");
      } else {
        window.location.replace("/sign_in.html");
      }
    }, 800);
  })();
</script>
</body>
</html>
