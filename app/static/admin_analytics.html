<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLMun Chatbot — Analytics</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { font-family: "Segoe UI", sans-serif; background: #f4f9f6; margin: 0; padding: 40px; }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { color: #0d3b2e; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 24px 0; }
  .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); border-left: 4px solid #0a8f60; }
  .card .label { color: #6c7b78; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
  .card .value { font-size: 32px; font-weight: 700; color: #0d3b2e; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
  th { background: #0d3b2e; color: white; padding: 14px; text-align: left; font-size: 14px; }
  td { padding: 12px 14px; border-bottom: 1px solid #eef4f1; font-size: 14px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f4f9f6; }
  .bar { display: inline-block; height: 8px; background: #0a8f60; border-radius: 4px; margin-right: 8px; vertical-align: middle; }
  h2 { color: #0d3b2e; margin-top: 32px; }
</style>
</head>
<body>
<div class="container">
  <h1>PLMun Chatbot — Analytics</h1>
  <p style="color:#6c7b78">Data pulled from the <code>messages</code> table. Refresh to update.</p>

  <div class="cards" id="summaryCards"></div>

  <h2>Top Intents</h2>
  <table id="intentsTable">
    <thead><tr><th>Intent</th><th>Count</th><th>Avg Confidence</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Daily Volume (Last 7 Days)</h2>
  <table id="dailyTable">
    <thead><tr><th>Date</th><th>Messages</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
async function load() {
  const res = await fetch("/api/admin/analytics");
  const data = await res.json();

  const s = data.summary;
  document.getElementById("summaryCards").innerHTML = `
    <div class="card"><div class="label">Conversations</div><div class="value">${s.total_conversations}</div></div>
    <div class="card"><div class="label">Registered Users</div><div class="value">${s.total_users}</div></div>
    <div class="card"><div class="label">Student Messages</div><div class="value">${s.total_student_messages}</div></div>
    <div class="card"><div class="label">Out-of-Scope Rate</div><div class="value">${(s.out_of_scope_rate * 100).toFixed(1)}%</div></div>
    <div class="card"><div class="label">Avg Confidence</div><div class="value">${(s.average_confidence * 100).toFixed(1)}%</div></div>
  `;

  const maxCount = Math.max(...data.top_intents.map(i => i.count), 1);
  document.querySelector("#intentsTable tbody").innerHTML = data.top_intents.map(i => `
    <tr>
      <td>${i.intent}</td>
      <td><span class="bar" style="width:${(i.count / maxCount) * 100}px"></span>${i.count}</td>
      <td>${(i.avg_confidence * 100).toFixed(1)}%</td>
    </tr>
  `).join("") || "<tr><td colspan='3' style='color:#999'>No data yet</td></tr>";

  document.querySelector("#dailyTable tbody").innerHTML = data.daily_volume.map(d => `
    <tr><td>${d.date}</td><td>${d.count}</td></tr>
  `).join("") || "<tr><td colspan='2' style='color:#999'>No data yet</td></tr>";
}
load();
</script>
</body>
</html>
